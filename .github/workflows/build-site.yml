name: Build site

# Rebuilds the HTML pages in docs/ whenever a project file or a guide changes,
# then commits the result. GitHub Pages serves the docs/ folder.
on:
  push:
    branches: [main]
    paths:
      - "projects/**"
      - "docs/*.md"
      - "docs/**/*.md"
      - "build_site.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Markdown library
        run: pip install markdown

      - name: Build the site
        run: python build_site.py

      - name: Commit the generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "Site already up to date."
          else
            git commit -m "Rebuild site [skip ci]"
            git pull --rebase origin main
            git push
          fi
